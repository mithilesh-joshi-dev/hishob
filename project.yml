name: TappyClone
options:
  bundleIdPrefix: com.mithilesh
  deploymentTarget:
    iOS: "17.0"
targets:
  TappyClone:
    type: application
    platform: iOS
    sources:
      - TappyClone
      - Shared
    dependencies:
      - target: TappyWidget
        embed: true
    info:
      path: Configs/TappyClone-Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLName: com.mithilesh.tappyclone
            CFBundleURLSchemes: [tappyclone]
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        SWIFT_VERSION: "5.9"
        PRODUCT_BUNDLE_IDENTIFIER: com.mithilesh.tappyclone
        CODE_SIGN_ENTITLEMENTS: Configs/TappyClone.entitlements
  TappyWidget:
    type: app-extension
    platform: iOS
    sources:
      - TappyWidget
      - Shared
    info:
      path: Configs/TappyWidget-Info.plist
      properties:
        CFBundleDisplayName: Tappy Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        SWIFT_VERSION: "5.9"
        PRODUCT_BUNDLE_IDENTIFIER: com.mithilesh.tappyclone.widget
        CODE_SIGN_ENTITLEMENTS: Configs/TappyWidget.entitlements
        SKIP_INSTALL: YES
