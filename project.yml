name: Hishob
options:
  bundleIdPrefix: com.mithilesh
  deploymentTarget:
    iOS: "17.0"
schemes:
  Hishob:
    build:
      targets:
        Hishob: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HishobTests
targets:
  Hishob:
    type: application
    platform: iOS
    sources:
      - Hishob
      - Shared
    dependencies:
      - target: HishobWidget
        embed: true
    info:
      path: Configs/Hishob-Info.plist
      properties:
        CFBundleDisplayName: Hishob
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLName: com.mithilesh.hishob
            CFBundleURLSchemes: [hishob]
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        SWIFT_VERSION: "5.9"
        PRODUCT_BUNDLE_IDENTIFIER: com.mithilesh.hishob
        CODE_SIGN_ENTITLEMENTS: Configs/Hishob.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  HishobTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - HishobTests
    dependencies:
      - target: Hishob
    settings:
      base:
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Hishob.app/Hishob"
        BUNDLE_LOADER: "$(TEST_HOST)"
  HishobWidget:
    type: app-extension
    platform: iOS
    sources:
      - HishobWidget
      - Shared
    info:
      path: Configs/HishobWidget-Info.plist
      properties:
        CFBundleDisplayName: Hishob Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        SWIFT_VERSION: "5.9"
        PRODUCT_BUNDLE_IDENTIFIER: com.mithilesh.hishob.widget
        CODE_SIGN_ENTITLEMENTS: Configs/HishobWidget.entitlements
        SKIP_INSTALL: YES
